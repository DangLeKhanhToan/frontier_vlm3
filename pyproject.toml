[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fvlm3"
version = "0.3.0"
description = "Frontier VLM harness for Arena (instruction-only VLN)"
requires-python = ">=3.10"
dependencies = [
    "arena_planners",
    "anthropic",
    "numpy",
    "opencv-python-headless",
    "pyyaml",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["fvlm3*"]
